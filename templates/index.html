<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Explorer • RocketAPI</title>
<style>
:root{--bg:#090b10;--panel:#11151d;--panel2:#171c26;--line:#252c38;--text:#eef2f7;--muted:#8e98a8;--accent:#7c8cff;--accent2:#a66cff;--good:#43d39e;--warn:#f5b94c;--bad:#ff6678}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17172b 0,#090b10 42%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:28px 18px 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:20px}.brand h1{font-size:27px;margin:0 0 8px}.brand p{color:var(--muted);margin:0}.search{background:rgba(17,21,29,.9);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;gap:10px;box-shadow:0 16px 50px #0005}.search input{flex:1;min-width:200px;background:#0b0e14;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 15px;font-size:15px;outline:none}.search button,.smallbtn{border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;padding:12px 18px;font-weight:700;cursor:pointer}.search button:disabled{opacity:.55}.status{min-height:25px;color:var(--muted);padding:12px 2px}.status.error{color:var(--bad)}.profile{display:grid;grid-template-columns:110px 1fr;gap:20px;background:linear-gradient(145deg,#151a24,#0f131a);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:8px}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#222938;border:3px solid #323a4b}.profile h2{margin:2px 0 5px;font-size:23px}.handle{color:var(--muted)}.bio{margin:12px 0;line-height:1.8;white-space:pre-wrap}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#0b0f16;border:1px solid var(--line);border-radius:12px;padding:9px 13px}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}.badges{margin-top:9px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#26304a;color:#9db1ff;font-size:11px;margin-left:5px}.private{background:#3a2d19;color:#f5c76b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;min-height:130px}.card h3{font-size:14px;margin:0 0 10px}.card .big{font-size:25px;font-weight:800}.card .muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0 12px;padding-bottom:3px}.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:9px 13px;cursor:pointer}.tab.active{background:#252c46;color:white;border-color:#49558a}.section{display:none}.section.active{display:block}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.media{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer}.media img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#181d26}.media .mi{padding:9px}.media .cap{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.person{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:9px}.person img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#222}.person .u{font-weight:700;font-size:13px}.person .n{color:var(--muted);font-size:11px;margin-top:3px}.raw{background:#080b10;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;max-height:430px;direction:ltr;text-align:left;font-size:12px;color:#bdc6d5}.empty{color:var(--muted);background:var(--panel);border:1px dashed var(--line);padding:22px;border-radius:14px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{width:min(900px,100%);max-height:92vh;overflow:auto;background:#11151d;border:1px solid var(--line);border-radius:20px;padding:18px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{background:#242b37;border:0;color:white;border-radius:10px;padding:8px 12px;cursor:pointer}.comments{display:grid;gap:8px;margin-top:12px}.comment{background:#0c1016;border:1px solid var(--line);border-radius:12px;padding:10px}.comment b{font-size:13px}.comment p{margin:5px 0;color:#c4cbd5;font-size:13px}.comment small{color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.media-grid{grid-template-columns:repeat(3,1fr)}.list{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.hero{display:block}.profile{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.stats{justify-content:center}.media-grid{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.search{flex-wrap:wrap}.search input{width:100%}}
</style></head>
<body><div class="wrap">
<div class="hero"><div class="brand"><h1>Instagram Explorer</h1><p>یک یوزرنیم وارد کن؛ اطلاعات قابل‌دسترسی حساب را در یک داشبورد ببین.</p></div></div>
<form class="search" id="form"><input id="username" placeholder="مثلاً nasa یا @nasa" autocomplete="off" required><button id="go">دریافت اطلاعات</button></form>
<div id="status" class="status"></div><div id="app"></div></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">جزئیات</h3><button class="close" onclick="closeModal()">بستن</button></div><div id="modalBody"></div></div></div>
<script>
const $=x=>document.querySelector(x), state={data:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=(body,keys=['users','items','medias','media','clips','stories','reels'])=>{for(const k of keys){if(Array.isArray(body?.[k]))return body[k];if(Array.isArray(body?.data?.[k]))return body.data[k]}return[]};
const user=u=>({id:String(u?.pk||u?.id||''),username:u?.username||'',name:u?.full_name||u?.name||'',pic:u?.profile_pic_url||u?.profile_pic_url_hd||'',private:!!u?.is_private,verified:!!u?.is_verified});
const media=m=>({id:String(m?.pk||m?.id||''),code:m?.code||m?.shortcode||'',pic:m?.image_versions2?.candidates?.[0]?.url||m?.display_url||m?.thumbnail_url||'',caption:typeof m?.caption==='object'?m.caption?.text:(m?.caption||''),likes:m?.like_count||m?.edge_media_preview_like?.count||0,comments:m?.comment_count||m?.edge_media_to_comment?.count||0,raw:m});
function section(name){return state.data?.sections?.[name]||null}
function people(body){return arr(body).map(user).filter(x=>x.username)}
function render(){const d=state.data,p=d.profile||{};let mediaItems=arr(section('media')).map(media);let clips=arr(section('clips')).map(media);let followers=people(section('followers')), following=people(section('following')), similar=people(section('similar')), tags=arr(section('tags')).map(media);$('#app').innerHTML=`
<div class="profile"><img class="avatar" src="${esc(p.profile_pic_url)}" onerror="this.style.visibility='hidden'"><div><h2>${esc(p.full_name||p.username)} ${p.is_verified?'<span class="badge">✓ Verified</span>':''}</h2><div class="handle">@${esc(p.username)} ${p.is_private?'<span class="badge private">Private</span>':''}</div><div class="bio">${esc(p.bio||'')}</div><div class="stats"><div class="stat"><b>${fmt(p.followers)}</b><span>Followers</span></div><div class="stat"><b>${fmt(p.following)}</b><span>Following</span></div><div class="stat"><b>${fmt(p.posts)}</b><span>Posts</span></div></div><div class="badges">${p.external_url?`<a class="badge" href="${esc(p.external_url)}" target="_blank">لینک خارجی</a>`:''}<a class="badge" href="https://instagram.com/${encodeURIComponent(p.username)}" target="_blank">Instagram</a></div></div></div>
<div class="grid"><div class="card"><h3>📸 Media</h3><div class="big">${mediaItems.length}</div><div class="muted">پست‌های دریافت‌شده</div></div><div class="card"><h3>🎬 Reels / Clips</h3><div class="big">${clips.length}</div><div class="muted">ویدئوهای دریافت‌شده</div></div><div class="card"><h3>👥 Followers</h3><div class="big">${followers.length}</div><div class="muted">نمونه/صفحه فعلی</div></div><div class="card"><h3>👥 Following</h3><div class="big">${following.length}</div><div class="muted">نمونه/صفحه فعلی</div></div></div>
<div class="tabs"><button class="tab active" data-tab="media">پست‌ها</button><button class="tab" data-tab="clips">Reels</button><button class="tab" data-tab="followers">Followers</button><button class="tab" data-tab="following">Following</button><button class="tab" data-tab="stories">Stories</button><button class="tab" data-tab="highlights">Highlights</button><button class="tab" data-tab="similar">Similar</button><button class="tab" data-tab="about">About</button><button class="tab" data-tab="tags">Tagged</button><button class="tab" data-tab="extra">Raw / Extra</button></div>
<div id="sec-media" class="section active">${mediaGrid(mediaItems)}</div><div id="sec-clips" class="section">${mediaGrid(clips)}</div><div id="sec-followers" class="section">${peopleGrid(followers)}</div><div id="sec-following" class="section">${peopleGrid(following)}</div><div id="sec-stories" class="section">${genericMedia(section('stories'))}</div><div id="sec-highlights" class="section">${genericMedia(section('highlights'))}</div><div id="sec-similar" class="section">${peopleGrid(similar)}</div><div id="sec-about" class="section">${json(section('about'))}</div><div id="sec-tags" class="section">${mediaGrid(tags)}</div><div id="sec-extra" class="section"><div class="raw">${esc(JSON.stringify({errors:d.errors,sections:d.sections},null,2))}</div></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#sec-'+b.dataset.tab).classList.add('active')});
 document.querySelectorAll('[data-media]').forEach(x=>x.onclick=()=>openMedia(x.dataset.media));
}
function fmt(x){return x==null?'—':Number(x).toLocaleString('en-US')}
function mediaGrid(list){if(!list.length)return '<div class="empty">داده‌ای برای این بخش برنگشت.</div>';return `<div class="media-grid">${list.map((m,i)=>`<div class="media" data-media="${i}" data-source='${esc(JSON.stringify(m.raw||m))}'><img src="${esc(m.pic)}" loading="lazy" onerror="this.style.visibility='hidden'"><div class="mi"><b>❤️ ${fmt(m.likes)} · 💬 ${fmt(m.comments)}</b><div class="cap">${esc(m.caption)}</div></div></div>`).join('')}</div>`}
function peopleGrid(list){if(!list.length)return '<div class="empty">داده‌ای برای این بخش برنگشت یا حساب محدود است.</div>';return `<div class="list">${list.map(u=>`<div class="person"><img src="${esc(u.pic)}" onerror="this.style.visibility='hidden'"><div><div class="u">@${esc(u.username)} ${u.verified?'✓':''}</div><div class="n">${esc(u.name)} ${u.private?'· Private':''}</div></div></div>`).join('')}</div>`}
function genericMedia(body){const a=arr(body,['items','stories','reels','media']);if(!a.length)return json(body);return mediaGrid(a.map(media))}
function json(o){return `<div class="raw">${esc(JSON.stringify(o||{},null,2))}</div>`}
function openMedia(index){const source=[...document.querySelectorAll('[data-source]')][Number(index)];if(!source)return;const raw=JSON.parse(source.dataset.source);const m=media(raw);$('#modalTitle').textContent='جزئیات پست';$('#modalBody').innerHTML=`<div class="card"><div style="display:flex;gap:15px;flex-wrap:wrap"><img src="${esc(m.pic)}" style="width:min(420px,100%);border-radius:14px;max-height:520px;object-fit:contain;background:#080b10"><div style="flex:1;min-width:220px"><p>${esc(m.caption)}</p><p>❤️ ${fmt(m.likes)} &nbsp; 💬 ${fmt(m.comments)}</p><button class="smallbtn" onclick="loadComments('${esc(m.id)}')">نمایش کامنت‌ها</button> <button class="smallbtn" onclick="loadLikes('${esc(m.code)}','${esc(m.id)}')">نمایش لایک‌ها</button><div id="details"></div></div></div></div>`;$('#modal').classList.add('show')}
async function action(payload){const r=await fetch('/api/rocket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||'خطا');return j}
async function loadComments(id){$('#details').innerHTML='<p class="muted">در حال دریافت کامنت‌ها...</p>';try{const b=await action({path:'instagram/media/get_comments',id,can_support_threading:false});const cs=arr(b,['comments','items']);$('#details').innerHTML=`<div class="comments">${cs.map(c=>`<div class="comment"><b>@${esc(c.user?.username||c.username||'')}</b><p>${esc(c.text||c.content||'')}</p><small>❤️ ${fmt(c.comment_like_count||c.like_count||0)} · ${fmt(cchild(c))} پاسخ</small></div>`).join('')||'<div class="empty">کامنتی برنگشت.</div>'}</div>`}catch(e){$('#details').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function cchild(c){return c.child_comment_count||c.reply_count||c.replies?.count||0}
async function loadLikes(code,id){$('#details').innerHTML='<p class="muted">در حال دریافت لایک‌ها...</p>';try{const path=code?'instagram/media/get_likes':'instagram/media/get_likes_by_id';const b=await action(code?{path,shortcode:code}:{path,id});const us=people(b);$('#details').innerHTML=peopleGrid(us)}catch(e){$('#details').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#form').onsubmit=async e=>{e.preventDefault();const u=$('#username').value.trim().replace(/^@/,'');if(!u)return;$('#go').disabled=true;$('#status').textContent='در حال دریافت پروفایل و بخش‌های اصلی...';$('#status').className='status';$('#app').innerHTML='';try{const r=await fetch('/api/profile?username='+encodeURIComponent(u));const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');state.data=d;render();const failed=Object.keys(d.errors||{}).length;$('#status').textContent=failed?`اطلاعات بارگذاری شد؛ ${failed} بخش به‌دلیل محدودیت API/دسترسی برنگشت.`:'تمام بخش‌های قابل‌دریافت بارگذاری شد.'}catch(e){$('#status').textContent=e.message;$('#status').className='status error'}finally{$('#go').disabled=false}};
</script></body></html>
